[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-core-closure"
version = "0.11.0"
description = "NOVA Core Closure reference implementation — Round 11 G5 SOS / Cl-safe Integration"
requires-python = ">=3.11"
license = {text = "Proprietary / research preview"}
authors = [{name = "Neo.K / EveMissLab"}]
dependencies = ["numpy>=1.26"]

[project.scripts]
nova = "nova_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
